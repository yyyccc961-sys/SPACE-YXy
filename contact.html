<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPACE Y | تواصل معنا</title><meta name="description" content="نساعد أصحاب المشاريع التجارية بصناعة محتوى إعلاني يوصل مشروعهم للجمهور المطلوب."><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="site.js"></script></head>
<body data-page="contact"><header class="topbar" id="siteHeader"></header>
<main><section class="page-hero"><span class="section-tag">تواصل معنا</span><h1>خلّينا نبدأ <span style="color:#b84dff">مشروعك</span></h1><p>عبّي النموذج أو راسلنا مباشرة، وراح نرد عليك بأقرب وقت.</p></section><section class="section-wrap contact"><div class="contact-panel"><span class="section-tag">طلب جديد</span><form id="requestForm"><div class="form-row"><label>الاسم<input name="customer_name" required maxlength="120"></label><label>رقم الهاتف<input name="phone" required maxlength="30" inputmode="tel" dir="ltr"></label></div><label>الخدمة المطلوبة<input name="service" maxlength="120" placeholder="مثلاً: إعلان سينمائي، هوية بصرية..."></label><label>تفاصيل المشروع<textarea name="details" rows="5" required maxlength="2000"></textarea></label><button class="button button-light" type="submit">إرسال الطلب ↗</button><p class="form-message" id="formMessage"></p></form></div><aside class="contact-aside"><span class="aside-label">REACH US</span><div class="big-star">✦</div><div class="contact-links" id="contactLinks"></div></aside></section></main>
<footer id="siteFooter"></footer></body></html>
